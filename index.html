<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Portal</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #080808;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }

        .portal {
            width: 90%;
            max-width: 420px;
            padding: 25px;
            background: #151515;
            border: 1px solid #292929;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .logo-button {
            width: 100%;
            height: 95px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            background: #202020;
            border: 1px solid #353535;
            border-radius: 17px;
            color: white;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .logo-button:hover {
            background: #2b2b2b;
            transform: scale(1.02);
        }

        .logo {
            width: 65px;
            height: 65px;
            flex-shrink: 0;
            object-fit: contain;
        }

        .button-text {
            font-size: 19px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .logo {
                width: 58px;
                height: 58px;
            }

            .logo-button {
                height: 85px;
            }
        }
    </style>
</head>

<body>

    <main class="portal">

        <!-- PS 1 -->
        <a class="logo-button"
           href="https://www.roblox.com/share?code=8a6049f1d608f845b1807bf8a9f791c8&type=Server"
           target="_blank"
           rel="noopener noreferrer">

            <img
                class="logo"
                src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Roblox_Logo_2022.jpg"
                alt="Roblox Logo">

            <span class="button-text">PS 1</span>
        </a>

        <!-- PS 2 -->
        <a class="logo-button"
           href="https://www.roblox.com/share?code=f1d3443f4da00e4c911801d58f76355e&type=Server"
           target="_blank"
           rel="noopener noreferrer">

            <img
                class="logo"
                src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Roblox_Logo_2022.jpg"
                alt="Roblox Logo">

            <span class="button-text">PS 2</span>
        </a>

        <!-- PS 3 -->
        <a class="logo-button"
           href="https://www.roblox.com/share?code=40ad9bfed5a5454ab8d38fbb503938a1&type=Server"
           target="_blank"
           rel="noopener noreferrer">

            <img
                class="logo"
                src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Roblox_Logo_2022.jpg"
                alt="Roblox Logo">

            <span class="button-text">PS 3</span>
        </a>

    </main>

</body>
</html>
